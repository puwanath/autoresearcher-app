[project]
name = "autoresearch"
version = "0.1.0"
description = "AutoResearch Agent — autonomous competitor research powered by vLLM + LangGraph"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "openai>=1.50",
    "tenacity>=9.0",
    "langgraph>=0.2.50",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "ddgs>=9.0",
    "playwright>=1.47",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "jinja2>=3.1",
    "markdown>=3.7",
    "weasyprint>=62",
    "typer>=0.12",
    "rich>=13.0",
    "python-slugify>=8.0",
]

[project.scripts]
autoresearch = "app.cli:app"

[dependency-groups]
dev = [
    "pypdf>=6.18.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
per-file-ignores = { "app/reports/charts.py" = ["E501"], "app/reports/pdf.py" = ["E501"] }  # SVG/CSS strings read better on one line
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends()/Query() in defaults is idiomatic
